[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "electralensai"
version = "1.0.0"
description = "ElectraLensAI — Interactive Election Process Education Platform"
requires-python = ">=3.12"
authors = [{ name = "ElectraLens Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "google-adk>=1.0.0",
    "google-cloud-aiplatform>=1.70.0",
    "google-cloud-secret-manager>=2.20.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    "langfuse>=2.36.0",
    "google-cloud-storage>=3.0.0",
    "google-cloud-dlp>=3.20.0",
    "google-cloud-translate>=3.18.0",
    "google-cloud-texttospeech>=2.17.0",
    "google-cloud-pubsub>=2.27.0",
    "google-cloud-logging>=3.11.0",
    "google-cloud-monitoring>=2.26.0",
    "python-dotenv>=1.0.1",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "google-cloud-firestore>=2.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["electra_agents", "api"]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "bandit[toml]>=1.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

# ─────────────────────────────────────────────────────────────────
# Ruff — 100% Score Configuration (ElectraLensAI-proven pattern)
# ─────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.egg-info",
    "dist",
    "build",
    "scratch",
    # Suppress pyrefly virtual environment ghost diagnostics
    "**/__pyrefly_virtual__/**",
    "**/inmemory/**",
    "d:/__pyrefly_virtual__/**",
    ".pyrefly",
    "web/**",
    "node_modules/**",
]

[tool.ruff.lint]
select = ["D", "ANN", "S", "E", "W", "F", "B", "I"]
ignore = [
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
    "ANN101", # missing-type-self (deprecated in Ruff 0.9+)
    "ANN102", # missing-type-cls (deprecated in Ruff 0.9+)
    "S101",   # assert-used (needed for pytest)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN", "D"]
"scripts/**" = ["T201"]

# ─────────────────────────────────────────────────────────────────
# Bandit — Security scan config
# ─────────────────────────────────────────────────────────────────
[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv", "__pycache__", "__pyrefly_virtual__"]
skips = []

# ─────────────────────────────────────────────────────────────────
# Pytest
# ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=electra_agents --cov=api --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
omit = ["tests/*", "scripts/*", "**/__pyrefly_virtual__/**"]
